<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LoveConnect</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .msg-box {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 15px 25px;
      border-radius: 10px;
      font-weight: 500;
      z-index: 10000;
      animation: slideDown 0.3s ease;
      max-width: 90%;
      text-align: center;
      font-size: 14px;
    }
    .msg-box.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    .msg-box.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    .msg-box.loading {
      background: #fff3cd;
      color: #856404;
      border: 1px solid #ffeaa7;
    }
    @keyframes slideDown {
      from { opacity: 0; transform: translateX(-50%) translateY(-20px); }
      to { opacity: 1; transform: translateX(-50%) translateY(0); }
    }
  </style>
</head>
<body>

<header>
  <h1>LoveConnect</h1>
  <p>Find your perfect match 💖</p>
</header>

<div class="container">

  <!-- Auth / Registration / Login -->
  <div id="auth-section">
    <h2 id="form-title">Sign Up</h2>

    <div id="auth-form">
      <input type="text" id="name" placeholder="Your Name">
      <input type="email" id="email" placeholder="your@email.com">
      <input type="password" id="password" placeholder="Password (min 6 chars)">

      <select id="gender">
        <option value="">Select Gender</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
      </select>

      <select id="interest">
        <option value="">Interested In</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
        <option value="both">Both</option>
      </select>

      <button type="button" id="submit-btn" onclick="submitForm()">Sign Up</button>
    </div>

    <p id="toggle-text">Already have an account? <a href="#" onclick="toggleForm()">Log In</a></p>
  </div>

  <!-- Main app area -->
  <div id="app" style="display:none;">

    <!-- Profile Completion Screen -->
    <div id="profile-setup" style="display:none; max-width:500px; margin:0 auto;">
      <h2>Complete Your Profile 💕</h2>
      <p>One last step before you can start matching!</p>

      <div style="margin:20px 0;">
        <label>Profile Picture</label><br>
        <input type="file" id="photo-input" accept="image/*">
        <div id="preview" style="margin-top:10px;">
          <img id="photo-preview" style="max-width:180px; border-radius:12px; display:none;">
        </div>
      </div>

      <textarea id="bio" placeholder="Tell others about yourself... (max 500 characters)" rows="5" maxlength="500"></textarea>

      <button onclick="saveProfile()" style="margin-top:20px; padding:12px 24px;">Save & Start Matching</button>
    </div>

    <!-- Matching / Browsing Screen -->
    <div id="matching-screen" style="display:none;">
      <h2>Welcome back, <span id="current-user-name">...</span>
        <span id="notif-badge" style="display:none; background:red; color:white; border-radius:50%; padding:4px 10px; font-size:14px;">0</span>
      </h2>
      <button onclick="logout()" style="margin-bottom:10px;">Log out</button>
      <button onclick="openUploadVideo()" style="margin-bottom:10px; background:#4d7cff;">🎬 Upload Video</button>
      <button onclick="openEditProfile()" style="margin-bottom:20px; background:#28a745;">📷 Edit Profile Picture</button>

      <h3>Find someone special</h3>
      <div id="profiles"></div>
    </div>

    <!-- Upload Video Screen -->
    <div id="upload-video-screen" style="display:none; max-width:500px; margin:0 auto;">
      <button onclick="closeUploadVideo()" style="margin-bottom:15px;">← Back</button>
      <h2>Upload a Video 🎬</h2>
      <input type="file" id="video-input" accept="video/*">
      <textarea id="video-caption" placeholder="Add a caption..." rows="3" maxlength="200" style="margin-top:15px;"></textarea>
      <button onclick="uploadVideo()" style="margin-top:15px;">Upload</button>
      <div id="upload-status" style="margin-top:10px;"></div>
    </div>

    <!-- Edit Profile Picture Screen -->
    <div id="edit-profile-screen" style="display:none; max-width:500px; margin:0 auto;">
      <button onclick="closeEditProfile()" style="margin-bottom:15px;">← Back</button>
      <h2>Update Profile Picture 📷</h2>
      <input type="file" id="edit-photo-input" accept="image/*">
      <div style="margin-top:10px;">
        <img id="edit-photo-preview" style="max-width:180px; border-radius:12px; display:none;">
      </div>
      <button onclick="updateProfilePicture()" style="margin-top:15px;">Save Photo</button>
    </div>

    <!-- Chat Screen -->
    <div id="chat-screen" style="display:none; max-width:600px; margin:0 auto;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
        <button onclick="closeChat()" style="padding:8px 16px;">← Back</button>
        <h3>Chat with <span id="chat-with-name">...</span></h3>
        <div></div>
      </div>

      <div id="chat-messages" style="height:400px; overflow-y:auto; border:1px solid #ddd; border-radius:10px; padding:15px; background:#fafafa; margin-bottom:15px;">
        <p style="text-align:center; color:#888;">Loading messages...</p>
      </div>

      <div style="display:flex; gap:10px;">
        <input type="text" id="message-input" placeholder="Type a message..." style="flex:1; padding:12px; border-radius:25px; border:1px solid #ddd;">
        <button onclick="sendMessage()" style="padding:12px 24px; border-radius:25px; background:#ff4d8d; color:white; border:none; cursor:pointer;">Send</button>
      </div>
    </div>

  </div>

</div>

<script src="script.js"></script>
</body>
</html>
