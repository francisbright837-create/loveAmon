<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Videos</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#0b0f1e;--nav:#1c3f9e;--ink:#fff;--mute:#b8c3e6;--pink:#ff4d8d;--chip:#ffffff1f;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root{--bg:#0b0f1e}}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;overflow:hidden}
.app{height:100%;display:flex;flex-direction:column;max-width:480px;margin:0 auto;position:relative;padding-top:env(safe-area-inset-top,0px)}
.top{position:absolute;z-index:5;top:env(safe-area-inset-top,0px);left:0;right:0;padding:12px 14px;display:flex;gap:8px;overflow-x:auto;background:linear-gradient(#000a,#0000)}
.chip{border:0;color:var(--ink);background:var(--chip);padding:7px 14px;border-radius:99px;font-size:14px;white-space:nowrap;cursor:pointer}
.chip[aria-pressed=true]{background:var(--pink)}
.feed{flex:1;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none}
.feed::-webkit-scrollbar{display:none}
.card{height:100%;scroll-snap-align:start;position:relative;overflow:hidden;display:flex;align-items:flex-end}
.card video,.card .art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.art{background:radial-gradient(circle at 30% 25%,var(--a),transparent 55%),radial-gradient(circle at 75% 70%,var(--b),transparent 55%),#0b0f1e;animation:drift 8s ease-in-out infinite alternate}
@keyframes drift{to{filter:hue-rotate(40deg);transform:scale(1.08)}}
@media (prefers-reduced-motion:reduce){.art{animation:none}}
.badge{position:absolute;top:64px;left:14px;background:#000a;padding:4px 10px;border-radius:6px;font-size:12px}
.info{position:relative;padding:16px 78px 20px 16px;background:linear-gradient(#0000,#000c);width:100%}
.info b{display:block;font-size:17px;margin-bottom:4px}
.info span{color:var(--mute);font-size:14px}
.rail{position:absolute;right:10px;bottom:90px;display:flex;flex-direction:column;gap:14px;align-items:center}
.rail button{background:#0008;border:0;color:var(--ink);width:48px;height:48px;border-radius:50%;font-size:20px;cursor:pointer}
.rail small{display:block;font-size:12px;text-align:center;margin-top:-10px}
.rail button[aria-pressed=true]{color:var(--pink)}
.empty{height:100%;display:grid;place-items:center;text-align:center;padding:30px;color:var(--mute)}
nav{background:var(--nav);display:flex;justify-content:space-around;padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px));font-size:12px}
nav a{color:var(--mute);text-decoration:none;text-align:center;min-width:44px}
nav a .i{display:block;font-size:20px}
nav a.on{color:var(--ink);font-weight:700}
.up{position:absolute;right:14px;top:calc(env(safe-area-inset-top,0px) + 14px);z-index:6}
:focus-visible{outline:3px solid #fff;outline-offset:2px}
</style>
</head>
<body>
<div class="app">
  <div class="top" id="chips" role="group" aria-label="Video categories"></div>
  <label class="chip up" style="display:none" id="upl">+ Add video<input type="file" accept="video/*" id="file" hidden></label>
  <main class="feed" id="feed"></main>
  <nav aria-label="Main">
    <a href="/"><span class="i">🏠</span>Home</a>
    <a href="#matches"><span class="i">👥</span>Matches</a>
    <a href="#ai" class="on"><span class="i">✨</span>AI</a>
    <a href="#world"><span class="i">🌍</span>World</a>
    <a href="#upload"><span class="i">➕</span>Upload</a>
    <a href="#messages"><span class="i">💬</span>Messages</a>
    <a href="#profile"><span class="i">👤</span>Profile</a>
  </nav>
</div>
<script src="/ai-video-feed.js"></script>
</body>
</html>
