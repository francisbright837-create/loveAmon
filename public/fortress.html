<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<title>Fortress of Embers</title>
<style>
:root{--bg:#07060a;--fg:#e9e2d4;--gold:#c9a45c;--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,"Times New Roman",serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
canvas{display:block;width:100%;height:100%;touch-action:none}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 45%,rgba(0,0,0,.75) 100%)}
#hud{position:fixed;left:calc(14px + var(--sl));top:calc(14px + var(--st));width:min(320px,48vw);pointer-events:none}
.bar{height:11px;background:rgba(0,0,0,.65);border:1px solid #6b6252;margin-bottom:5px;box-shadow:0 0 6px #000}
.bar i{display:block;height:100%;transition:width .12s}
#hp i{background:linear-gradient(#d4503a,#7a1810)}#st i{background:linear-gradient(#7cc45a,#3b6a28)}
#info{position:fixed;right:calc(16px + var(--sr));top:calc(14px + var(--st));text-align:right;font-size:14px;line-height:1.45;color:var(--gold);text-shadow:0 0 6px #000;pointer-events:none;max-width:48vw}
#pw{font-size:20px;letter-spacing:.2em;min-height:24px}
#boss{position:fixed;left:50%;top:calc(12px + var(--st));transform:translateX(-50%);width:min(440px,44vw);display:none;pointer-events:none;text-align:center;font-size:13px;letter-spacing:.14em;color:#e0b0a0;text-shadow:0 0 6px #000}
#boss .bar{height:13px;margin:3px 0 0;border-color:#8a4a3a}#boss .bar i{background:linear-gradient(#e8603a,#8a1a10);transition:width .2s}
#exit,#newg{position:fixed;background:rgba(0,0,0,.55);color:var(--fg);border:1px solid #6b6252;font:13px Georgia,serif;border-radius:8px;z-index:5;touch-action:manipulation}
#exit{right:calc(14px + var(--sr));top:calc(78px + var(--st));padding:9px 13px}
#newg{left:calc(14px + var(--sl));top:calc(52px + var(--st));padding:6px 10px;font-size:12px;opacity:.75}
#msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;pointer-events:none;font-size:clamp(24px,6.5vw,58px);letter-spacing:.14em;color:#c8b27a;text-shadow:0 0 24px #000;opacity:0;transition:opacity .5s;padding:0 18px}
#msg small{font-size:clamp(13px,2.6vw,19px);letter-spacing:.06em;line-height:1.5;color:#b0a692;margin-top:12px}
#lock{position:fixed;width:18px;height:18px;margin:-9px 0 0 -9px;border:2px solid #e24a38;transform:rotate(45deg);pointer-events:none;display:none;box-shadow:0 0 8px #e24a38}
.dmg{position:fixed;color:#ffd7a0;font-weight:bold;text-shadow:0 0 6px #000,0 0 3px #a33;pointer-events:none;font-size:20px;transform:translate(-50%,-50%)}
.btn{position:fixed;border-radius:50%;border:2px solid rgba(201,164,92,.75);background:rgba(10,8,6,.55);color:var(--fg);display:flex;align-items:center;justify-content:center;text-align:center;font:600 15px Georgia,serif;touch-action:none;z-index:4;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);transition:transform .06s,background .06s}
.btn.on{background:rgba(201,164,92,.38);transform:scale(.93)}
#bA{right:calc(22px + var(--sr));bottom:calc(26px + var(--sb));width:106px;height:106px;font-size:17px}
#bR{right:calc(142px + var(--sr));bottom:calc(22px + var(--sb));width:80px;height:80px}
#bP{right:calc(34px + var(--sr));bottom:calc(148px + var(--sb));width:78px;height:78px;display:none;border-color:#ffd27a;box-shadow:0 0 14px rgba(255,210,120,.5)}
#bL{right:calc(138px + var(--sr));bottom:calc(114px + var(--sb));width:58px;height:58px;font-size:12px}
#joy{position:fixed;border-radius:50%;border:2px solid rgba(255,255,255,.45);background:rgba(255,255,255,.07);display:none;pointer-events:none;width:128px;height:128px;margin:-64px 0 0 -64px;z-index:3}
#joy i{position:absolute;width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.4);left:36px;top:36px}
#joyHint{position:fixed;left:calc(34px + var(--sl));bottom:calc(40px + var(--sb));width:128px;height:128px;border-radius:50%;border:2px dashed rgba(255,255,255,.3);pointer-events:none;opacity:.55;transition:opacity .2s;display:none;align-items:center;justify-content:center;font-size:12px;color:rgba(255,255,255,.5)}
#fade{position:fixed;inset:0;background:#000;opacity:0;transition:opacity .8s;pointer-events:none;z-index:9}
#help{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + var(--sb));font-size:12px;color:#9a9282;pointer-events:none;line-height:1.5;text-align:center;transition:opacity 1.2s;width:max-content;max-width:60vw}
#help .t{display:none}
@media (pointer:coarse){#joyHint{display:flex}#help .t{display:inline}#help .d{display:none}}
@media (orientation:portrait){#bA{bottom:calc(86px + var(--sb))}#bR{bottom:calc(82px + var(--sb))}#bP{bottom:calc(208px + var(--sb))}#bL{bottom:calc(174px + var(--sb))}#joyHint{bottom:calc(100px + var(--sb))}#help{max-width:90vw}}
@media (max-height:430px){#bA{width:92px;height:92px}#bR{width:70px;height:70px;right:calc(128px + var(--sr))}#bP{width:68px;height:68px;bottom:calc(128px + var(--sb))}#bL{right:calc(124px + var(--sr));bottom:calc(98px + var(--sb))}}
</style></head><body>
<div id="vig"></div>
<div id="hud"><div class="bar" id="hp"><i style="width:100%"></i></div><div class="bar" id="st"><i style="width:100%"></i></div></div>
<button id="newg">⟲ New game</button>
<div id="boss"><div id="bossName"></div><div class="bar"><i style="width:100%"></i></div></div>
<div id="info"><div id="souls">Souls 0</div><div id="lvl"></div><div id="wave"></div><div id="pw"></div></div>
<div id="msg"></div><div id="lock"></div><div id="joyHint">move</div><div id="joy"><i></i></div>
<div class="btn" id="bA">Attack</div><div class="btn" id="bR">Roll</div><div class="btn" id="bP">Power</div><div class="btn" id="bL">Auto</div>
<button id="exit">✕ Exit</button>
<div id="help"><span class="d">WASD move · Space roll · J / click attack · E power · Q auto-target · drag to turn camera</span><span class="t">Left thumb: move · Hold Attack to keep swinging · Roll to dodge · Auto aims for you</span></div>
<div id="fade"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="fortress.js?v=2"></script>
</body></html>
