<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Fortress of Embers</title>
<style>
:root{--bg:#07060a;--fg:#e9e2d4;--gold:#c9a45c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#07060a;--fg:#e9e2d4}}
:root[data-theme="dark"]{--bg:#07060a;--fg:#e9e2d4}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,"Times New Roman",serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
canvas{display:block;width:100%;height:100%}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 45%,rgba(0,0,0,.75) 100%)}
#hud{position:fixed;left:calc(14px + env(safe-area-inset-left,0px));top:calc(14px + env(safe-area-inset-top,0px));width:min(320px,52vw);pointer-events:none}
.bar{height:10px;background:rgba(0,0,0,.65);border:1px solid #6b6252;margin-bottom:5px;box-shadow:0 0 6px #000}
.bar i{display:block;height:100%;transition:width .12s}
#hp i{background:linear-gradient(#d4503a,#7a1810)}#st i{background:linear-gradient(#7cc45a,#3b6a28)}
#powers{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.pw{width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.55);border:1px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:0 0 8px rgba(201,164,92,.35)}
#info{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));top:calc(14px + env(safe-area-inset-top,0px));text-align:right;font-size:14px;color:var(--gold);text-shadow:0 0 6px #000;pointer-events:none}
#boss{position:fixed;top:calc(60px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:min(420px,38vw);display:none;text-align:center;pointer-events:none;font-size:13px;letter-spacing:.14em;color:#e0b0a0;text-shadow:0 0 6px #000}
#bosshp{height:12px}#bosshp i{background:linear-gradient(#e0402a,#6a0c08)}
#phint{position:fixed;top:calc(112px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:none;align-items:center;gap:8px;pointer-events:none;color:#d8b4ff;font-size:15px;text-shadow:0 0 8px #000;background:rgba(20,8,40,.55);border:1px solid #8a5ad0;border-radius:20px;padding:5px 14px}
#parrow{display:inline-block;font-size:18px}
#exit{position:fixed;right:calc(14px + env(safe-area-inset-right,0px));top:calc(58px + env(safe-area-inset-top,0px));background:rgba(0,0,0,.55);color:var(--fg);border:1px solid #6b6252;padding:6px 10px;font:12px Georgia,serif;border-radius:6px;z-index:5}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .65s}
#msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;pointer-events:none;font-size:clamp(26px,7vw,64px);letter-spacing:.14em;color:#c8b27a;text-shadow:0 0 24px #000;opacity:0;transition:opacity 1.2s;text-align:center;padding:0 12px}
#msg small{font-size:clamp(13px,2.6vw,20px);letter-spacing:.08em;color:#b4ab98;margin-top:12px;line-height:1.5}
#lock{position:fixed;width:18px;height:18px;margin:-9px 0 0 -9px;border:2px solid #e24a38;transform:rotate(45deg);pointer-events:none;display:none;box-shadow:0 0 8px #e24a38}
.dmg{position:fixed;color:#ffd7a0;font-weight:bold;text-shadow:0 0 6px #000,0 0 3px #a33;pointer-events:none;font-size:20px;transform:translate(-50%,-50%)}
/* touch buttons: big, in a thumb arc, with an invisible extra ring so a sloppy tap still counts */
.btn{position:fixed;border-radius:50%;border:2px solid rgba(201,164,92,.75);background:rgba(10,8,6,.5);color:var(--fg);display:flex;align-items:center;justify-content:center;font:15px Georgia,serif;touch-action:none;z-index:4;transition:transform .06s,background .06s}
.btn::after{content:'';position:absolute;inset:-16px;border-radius:50%}
.btn.on{background:rgba(201,164,92,.38);transform:scale(.92)}
#bA{right:calc(22px + env(safe-area-inset-right,0px));bottom:calc(58px + env(safe-area-inset-bottom,0px));width:100px;height:100px;font-size:17px}
#bR{right:calc(136px + env(safe-area-inset-right,0px));bottom:calc(30px + env(safe-area-inset-bottom,0px));width:76px;height:76px}
#bL{right:calc(44px + env(safe-area-inset-right,0px));bottom:calc(172px + env(safe-area-inset-bottom,0px));width:66px;height:66px}
#joy{position:fixed;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:rgba(255,255,255,.06);display:none;pointer-events:none;width:130px;height:130px;margin:-65px 0 0 -65px}
#joy i{position:absolute;width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.35);left:38px;top:38px}
#help{position:fixed;left:14px;bottom:14px;font-size:12px;color:#8a8272;pointer-events:none;line-height:1.5;max-width:46vw}
</style></head><body>
<div id="vig"></div>
<div id="hud"><div class="bar" id="hp"><i style="width:100%"></i></div><div class="bar" id="st"><i style="width:100%"></i></div><div id="powers"></div></div>
<div id="info"><div id="souls">Souls 0</div><div id="wave"></div></div>
<div id="boss"><div id="bossname"></div><div class="bar" id="bosshp"><i style="width:100%"></i></div></div>
<div id="phint"><span id="parrow">▲</span><span id="pdist">Portal</span></div>
<div id="fade"></div>
<div id="msg"></div><div id="lock"></div><div id="joy"><i></i></div>
<div class="btn" id="bA">Attack</div><div class="btn" id="bR">Roll</div><div class="btn" id="bL">Lock</div>
<button id="exit">✕ Exit</button>
<div id="help">WASD move · Space roll · J / click attack · Q lock-on · drag to turn camera</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="fortress.js"></script>
</body></html>
